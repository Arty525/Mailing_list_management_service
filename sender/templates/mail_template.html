<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
    <style>
        /* Базовые стили для email-клиентов (будут применены также через inline) */
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            font-family: Arial, sans-serif;
            line-height: 1.5;
            color: #333333;
        }
        .header {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .content {
            font-size: 16px;
            margin-bottom: 30px;
        }
        .divider {
            border-top: 2px solid #e0e0e0;
            margin: 20px 0;
        }
        .contacts {
            font-size: 14px;
            color: #555555;
            margin-bottom: 30px;
        }
        .logo {
            text-align: center;
            margin-top: 20px;
        }
        .logo img {
            max-width: 150px;
            height: auto;
            border: 0;
        }
        @media only screen and (max-width: 480px) {
            .email-container {
                width: 100% !important;
            }
        }
    </style>
</head>
<body style="margin: 0; padding: 20px; background-color: #f4f4f4;">
    <table align="center" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px; background-color: #ffffff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
        <tr>
            <td style="padding: 30px 20px;">
                <!-- ЗАГОЛОВОК -->
                <h1 style="margin: 0 0 20px 0; font-size: 28px; color: #2c3e50; font-weight: normal;">{{ title }}</h1>
                
                <!-- ОСНОВНОЙ ТЕКСТ -->
                <div style="margin-bottom: 30px; font-size: 16px; line-height: 1.6; color: #333333;">
                    {{ message_body|linebreaksbr }}
                </div>
                
                <!-- РАЗДЕЛИТЕЛЬ -->
                <div style="border-top: 2px solid #e0e0e0; margin: 20px 0;"></div>
                
                <!-- КОНТАКТЫ -->
                <div style="font-size: 14px; color: #555555; margin-bottom: 30px;">
                    <strong>Контакты:</strong><br>
                    Телефон: {{ phone }}<br>
                    Email: <a href="mailto:{{ contact_email }}" style="color: #2980b9; text-decoration: none;">{{ contact_email }}</a><br>
                    Адрес: {{ address }}
                </div>
                
                <!-- ЛОГОТИП -->
                <div style="text-align: center; margin-top: 20px;">
                    {% if logo_url %}
                        <img src="{{ logo_url }}" alt="Formoza" style="max-width: 150px; height: auto; border: 0;">
                    {% endif %}
                </div>
            </td>
        </tr>
    </table>
</body>
</html>
